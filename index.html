<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber-Buddy Kontrol Paneli</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #0ea5e9; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .dashboard { background: #1e293b; padding: 20px; border-radius: 15px; display: inline-block; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(14, 165, 233, 0.2); margin-bottom: 20px; }
        .data-row { font-size: 20px; margin: 10px 0; color: #f8fafc; }
        .data-row span { color: #0ea5e9; font-weight: bold; font-size: 28px;}
        button { background: #0ea5e9; color: #fff; border: none; padding: 15px; width: 90%; max-width: 300px; margin: 8px; cursor: pointer; border-radius: 12px; font-weight: bold; font-size: 16px; }
        .btn-grinch { background: #ef4444; }
    </style>
</head>
<body>

    <h1>🚀 BUDDY KONTROL</h1>
    <div id="status">Bağlanılıyor...</div>
    
    <div class="dashboard">
        <div class="data-row">İç: <span id="inTemp">--</span>°C | <span id="inHum">--</span>%</div>
        <div class="data-row">Dış: <span id="outTemp">--</span>°C</div>
    </div>

    <div class="controls">
        <button onclick="sendCommand('smile')">Gülümset</button>
        <button onclick="sendCommand('surprise')">Şaşırt</button>
        <button class="btn-grinch" onclick="sendCommand('grinch')">Grinch Modu!</button>
    </div>

    <script>
        const client = mqtt.connect('ws://broker.hivemq.com:8000/mqtt');

        client.on('connect', () => {
            document.getElementById('status').innerText = "🟢 Bağlı";
            client.subscribe('ostimbul/buddy/data');
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            document.getElementById('inTemp').innerText = data.inTemp || '--';
            document.getElementById('inHum').innerText = data.inHum || '--';
            document.getElementById('outTemp').innerText = data.outTemp || '--';
        });

        function sendCommand(cmd) {
            client.publish('ostimbul/buddy/command', cmd);
        }
    </script>
</body>
</html>
